# cargo-about config for the bundled third-party license notices.
#
# Generate the release notice (run from the repo root) with:
#   cargo install cargo-about --locked --features cli --version 0.9.0
#   cargo about generate -c packaging/licenses/about.toml -o target/dist/ParamEx/THIRD-PARTY-LICENSES.html packaging/licenses/about.hbs
#
# `targets` scopes the report to the Windows binary that actually ships, so the
# notices list only the dependencies linked into ParamEx.exe.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# The workspace's own crates are first-party, not third-party; exclude them.
[private]
ignore = true
